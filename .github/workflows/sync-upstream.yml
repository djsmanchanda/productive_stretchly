name: Sync upstream

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      validate_branch:
        description: 'Run the full cross-platform checks and Linux build on the current fix branch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.sync.outputs.has_update }}
      branch: ${{ steps.sync.outputs.branch }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare upstream merge candidate
        id: sync
        shell: bash
        env:
          VALIDATE_BRANCH: ${{ inputs.validate_branch || false }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/hovancik/stretchly.git
          git fetch upstream trunk
          git fetch origin fix/linux-multiscreen-break-windows

          if git merge-base --is-ancestor upstream/trunk origin/fix/linux-multiscreen-break-windows && [[ "$VALIDATE_BRANCH" != "true" ]]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=automation/upstream-sync
          git switch --detach origin/fix/linux-multiscreen-break-windows
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            merge --no-ff --no-edit upstream/trunk
          git push --force origin "HEAD:refs/heads/$branch"

          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.has_update == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Linux test display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 xvfb libinput-dev libudev-dev

      - name: Checkout merge candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Install missing usocket
        if: runner.os == 'Linux'
        run: npm install usocket

      - name: Rebuild native modules for Node.js
        run: npm rebuild node-desktop-idle-v2

      - name: Run lint and tests
        if: runner.os != 'Linux'
        run: |
          npm run lint
          npm test

      - name: Run lint and tests under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash -lc 'npm run lint && npm test'
        env:
          DISPLAY: ':0'
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: npm run pack

  merge:
    needs: [prepare, test]
    if: needs.prepare.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward fork fix branch after all checks pass
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin fix/linux-multiscreen-break-windows "$BRANCH"
          git switch --detach origin/fix/linux-multiscreen-break-windows
          git merge --ff-only "origin/$BRANCH"
          git push origin HEAD:fix/linux-multiscreen-break-windows
          git push origin --delete "$BRANCH"

  alert:
    needs: [prepare, test, merge]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create or update an assigned attention issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream Stretchly sync needs attention'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `@${context.repo.owner} The automatic sync from hovancik/stretchly/trunk failed during merge preparation, the Linux/macOS/Windows checks, or the final push. Check the fork's fix branch before retrying.\n\nReview this run: ${runUrl}`
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })
            const existing = issues.find(issue => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner]
              })
            }

  close-alert:
    needs: [prepare, test, merge]
    if: success() && needs.prepare.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Close resolved attention issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream Stretchly sync needs attention'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })
            const existing = issues.find(issue => issue.title === title)
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              })
            }
